# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/github/super-linter
name: Lint Code Base

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v4
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: develop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Align Checkstyle with google-java-format (already enabled above).
          # Default sun_checks (80-col / full Javadoc) fails on this codebase.
          # google_checks.xml is not embedded in super-linter v4; ship it under
          # .github/linters/ (see issue super-linter/super-linter#5503).
          LINTER_RULES_PATH: .github/linters
          JAVA_FILE_NAME: google_checks.xml
